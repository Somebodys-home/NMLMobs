name: NMLMobs
version: '${version}'

main: io.github.NoOne.nMLMobs.NMLMobs
api-version: '26.3'
load: POSTWORLD
depend:
  - NMLDamages
loadbefore:
  - NMLDamages
commands:
  nmlSummon:
    description: Spawns a custom NML mob
    usage: /<command> <name>
  nmlKill:
    description: Removes all NML mobs in a range
    usage: /<command> <range>